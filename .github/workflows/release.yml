# Overdrive release: build all runtime binaries and TurboVec libs, publish platform zips.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-check/**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            bin: overdrive-runtime-linux-amd64
            lib: liboverdrive_turbovec_ffi.so
          - runner: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            bin: overdrive-runtime-linux-arm64
            lib: liboverdrive_turbovec_ffi.so
          - runner: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            bin: overdrive-runtime-darwin-arm64
            lib: liboverdrive_turbovec_ffi.dylib
          - runner: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            bin: overdrive-runtime-darwin-amd64
            lib: liboverdrive_turbovec_ffi.dylib
          - runner: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            bin: overdrive-runtime-windows-amd64.exe
            lib: overdrive_turbovec_ffi.dll
          - runner: windows-latest
            target: windows-arm64
            goos: windows
            goarch: arm64
            bin: overdrive-runtime-windows-arm64.exe
            lib: overdrive_turbovec_ffi.dll

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache: false
          cache-dependency-path: runtime/experience/go.sum

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
          use-cache: false

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-zigbuild

      - name: Build runtime and TurboVec FFI
        shell: bash
        run: bash scripts/build-runtime.sh "${{ matrix.target }}"

      - name: Verify artifacts
        shell: bash
        run: |
          test -s "runtime/bin/${{ matrix.bin }}"
          test -s "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}"
          test "$(wc -c < "runtime/bin/${{ matrix.bin }}")" -gt 100000
          test "$(wc -c < "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}")" -gt 10000
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python scripts/verify_windows_dll.py "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}"
          fi

      - name: Package platform zip (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          cp "runtime/bin/${{ matrix.bin }}" "dist/${{ matrix.target }}/"
          cp "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}" "dist/${{ matrix.target }}/"
          (cd dist && zip -r "overdrive-runtime-${{ matrix.target }}.zip" "${{ matrix.target }}")

      - name: Package platform zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.target }}" | Out-Null
          Copy-Item "runtime/bin/${{ matrix.bin }}" "dist/${{ matrix.target }}/"
          Copy-Item "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}" "dist/${{ matrix.target }}/"
          Compress-Archive -Path "dist/${{ matrix.target }}" -DestinationPath "dist/overdrive-runtime-${{ matrix.target }}.zip" -Force

      - name: Upload platform artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: overdrive-runtime-${{ matrix.target }}
          path: dist/overdrive-runtime-${{ matrix.target }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*.zip
          generate_release_notes: true
