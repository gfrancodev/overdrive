# Overdrive release: build all runtime binaries, TurboVec libs and trays, publish platform zips.
# A manual run, or a push to a release-check/ branch, builds and verifies every bundle without publishing.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-check/**"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            bin: overdrive-runtime-linux-amd64
            lib: liboverdrive_turbovec_ffi.so
            native: true
          - runner: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            bin: overdrive-runtime-linux-arm64
            lib: liboverdrive_turbovec_ffi.so
          - runner: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            bin: overdrive-runtime-darwin-arm64
            lib: liboverdrive_turbovec_ffi.dylib
            native: true
          - runner: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            bin: overdrive-runtime-darwin-amd64
            lib: liboverdrive_turbovec_ffi.dylib
          - runner: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            bin: overdrive-runtime-windows-amd64.exe
            lib: overdrive_turbovec_ffi.dll
            native: true
          - runner: windows-latest
            target: windows-arm64
            goos: windows
            goarch: arm64
            bin: overdrive-runtime-windows-arm64.exe
            lib: overdrive_turbovec_ffi.dll

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache: false
          cache-dependency-path: runtime/experience/go.sum

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.13.0
          use-cache: false

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-zigbuild

      - name: Build runtime and TurboVec FFI
        shell: bash
        run: bash scripts/build-runtime.sh "${{ matrix.target }}"

      - name: Build tray
        shell: bash
        run: bash scripts/build-tray.sh "${{ matrix.target }}"

      - name: Verify artifacts
        shell: bash
        run: |
          test -s "runtime/bin/${{ matrix.bin }}"
          test -s "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}"
          test "$(wc -c < "runtime/bin/${{ matrix.bin }}")" -gt 100000
          test "$(wc -c < "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}")" -gt 10000
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python scripts/verify_windows_dll.py "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}"
          fi

      - name: Package platform zip (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "dist/${{ matrix.target }}"
          cp "runtime/bin/${{ matrix.bin }}" "dist/${{ matrix.target }}/"
          cp "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}" "dist/${{ matrix.target }}/"
          (cd dist && zip -r "overdrive-runtime-${{ matrix.target }}.zip" "${{ matrix.target }}")

      - name: Package platform zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.target }}" | Out-Null
          Copy-Item "runtime/bin/${{ matrix.bin }}" "dist/${{ matrix.target }}/"
          Copy-Item "runtime/lib/${{ matrix.target }}/${{ matrix.lib }}" "dist/${{ matrix.target }}/"
          Compress-Archive -Path "dist/${{ matrix.target }}" -DestinationPath "dist/overdrive-runtime-${{ matrix.target }}.zip" -Force

      - name: Package install bundle
        shell: bash
        env:
          OVERDRIVE_REQUIRE_TRAY: "1"
        run: bash scripts/package-platform.sh "${{ matrix.target }}"

      - name: Smoke install from bundle (Unix)
        if: matrix.native && runner.os != 'Windows'
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/overdrive-smoke"
          OVERDRIVE_HOME="$smoke/home" OVERDRIVE_BIN_DIR="$smoke/bin" OVERDRIVE_SKILLS_DIR="$smoke/skills" \
            OVERDRIVE_TRAY_ENABLE=0 OVERDRIVE_EMBEDDER=stub \
            bash "dist/install-${{ matrix.target }}/scripts/install.sh"
          cmp "$smoke/bin/overdrive-tray" "dist/install-${{ matrix.target }}/runtime/bin/overdrive-tray-${{ matrix.target }}"
          OVERDRIVE_HOME="$smoke/home" OVERDRIVE_EMBEDDER=stub "$smoke/bin/overdrive-runtime" status \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s); assert s["turbovec_available"], "TurboVec did not load"'

      - name: Smoke install from bundle (Windows)
        if: matrix.native && runner.os == 'Windows'
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "overdrive-smoke"
          $env:OVERDRIVE_HOME = Join-Path $smoke "home"
          $env:OVERDRIVE_BIN_DIR = Join-Path $smoke "bin"
          $env:OVERDRIVE_SKILLS_DIR = Join-Path $smoke "skills"
          $env:OVERDRIVE_TRAY_ENABLE = "0"
          $env:OVERDRIVE_EMBEDDER = "stub"
          & "dist/install-${{ matrix.target }}/scripts/install.ps1"
          $tray = Join-Path $env:OVERDRIVE_BIN_DIR "overdrive-tray.exe"
          if ((Get-FileHash $tray).Hash -ne (Get-FileHash "dist/install-${{ matrix.target }}/runtime/bin/overdrive-tray-${{ matrix.target }}.exe").Hash) { throw "installed tray is not the bundled one" }
          $status = & (Join-Path $env:OVERDRIVE_BIN_DIR "overdrive-runtime.exe") status | ConvertFrom-Json
          $status
          if (-not $status.turbovec_available) { throw "TurboVec did not load" }

      # Every other smoke runs with the stub embedder. This one downloads ONNX Runtime and MiniLM into a fresh home,
      # with an accent in its path, and fails unless the shipped binary embeds with them.
      - name: MiniLM from a fresh home (Unix)
        if: matrix.native && runner.os != 'Windows'
        shell: bash
        run: |
          OVERDRIVE_HOME="$RUNNER_TEMP/overdrive-minilm-ção" "$RUNNER_TEMP/overdrive-smoke/bin/overdrive-runtime" status \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s); assert (s["embedder"], s["embedder_dim"]) == ("minilm", 384), "MiniLM did not run"'

      - name: MiniLM from a fresh home (Windows)
        if: matrix.native && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OVERDRIVE_HOME = Join-Path $env:RUNNER_TEMP "overdrive-minilm-ção"
          $status = & (Join-Path $env:RUNNER_TEMP "overdrive-smoke/bin/overdrive-runtime.exe") status | ConvertFrom-Json
          $status
          if ($status.embedder -ne "minilm" -or $status.embedder_dim -ne 384) { throw "MiniLM did not run" }

      - name: Upgrade with the Core running (Unix)
        if: matrix.native && runner.os != 'Windows'
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/overdrive-smoke"
          export OVERDRIVE_HOME="$smoke/home" OVERDRIVE_BIN_DIR="$smoke/bin" OVERDRIVE_SKILLS_DIR="$smoke/skills"
          export OVERDRIVE_TRAY_ENABLE=0 OVERDRIVE_EMBEDDER=stub OVERDRIVE_SHARE_LISTEN=127.0.0.1:7841
          "$smoke/bin/overdrive-runtime" share listen --cwd "$smoke" >/dev/null 2>&1 &
          core=$!
          for i in $(seq 1 100); do curl -fsS http://127.0.0.1:7842/api/core/ui >/dev/null 2>&1 && break; sleep 0.2; done
          bash "dist/install-${{ matrix.target }}/scripts/install.sh"
          kill -0 "$core"
          curl -fsS http://127.0.0.1:7842/api/core/ui
          kill "$core"

      - name: Upgrade with the Core running (Windows)
        if: matrix.native && runner.os == 'Windows'
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "overdrive-smoke"
          $env:OVERDRIVE_HOME = Join-Path $smoke "home"
          $env:OVERDRIVE_BIN_DIR = Join-Path $smoke "bin"
          $env:OVERDRIVE_SKILLS_DIR = Join-Path $smoke "skills"
          $env:OVERDRIVE_TRAY_ENABLE = "0"
          $env:OVERDRIVE_EMBEDDER = "stub"
          $env:OVERDRIVE_SHARE_LISTEN = "127.0.0.1:7841"
          $core = Start-Process -FilePath (Join-Path $env:OVERDRIVE_BIN_DIR "overdrive-runtime.exe") -ArgumentList "share","listen","--cwd",$smoke -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 100; $i++) { try { Invoke-RestMethod http://127.0.0.1:7842/api/core/ui | Out-Null; break } catch { Start-Sleep -Milliseconds 200 } }
          & "dist/install-${{ matrix.target }}/scripts/install.ps1"
          if ($core.HasExited) { throw "upgrading stopped the running Core" }
          Invoke-RestMethod http://127.0.0.1:7842/api/core/ui | Out-Null
          Stop-Process -Id $core.Id

      - name: Zip install bundle (Unix)
        if: runner.os != 'Windows'
        run: (cd dist && zip -qr "overdrive-${{ matrix.target }}.zip" "install-${{ matrix.target }}")

      - name: Zip install bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/install-${{ matrix.target }}" -DestinationPath "dist/overdrive-${{ matrix.target }}.zip" -Force

      - name: Upload platform artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: overdrive-runtime-${{ matrix.target }}
          path: |
            dist/overdrive-runtime-${{ matrix.target }}.zip
            dist/overdrive-${{ matrix.target }}.zip
          if-no-files-found: error

  # A release-check push closes a milestone: mutate every runtime line changed since main.
  mutation:
    name: Mutation
    if: startsWith(github.ref, 'refs/heads/release-check/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache-dependency-path: runtime/experience/go.sum

      - name: Mutation gate on the lines changed since main
        env:
          OVERDRIVE_EMBEDDER: stub
          OVERDRIVE_SKIP_EMBED_DOWNLOAD: "1"
        run: bash scripts/mutation.sh --base origin/main --workers 3

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          # A tag with a suffix (v2.3.0-rc.1) is a pre-release: it never becomes the "latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
