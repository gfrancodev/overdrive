# Overdrive CI: structure validation, pytest (stub embedder), shell syntax checks, Go coverage gate, SonarCloud.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: runtime/experience/go.sum

      - name: Install test dependencies
        run: "pip install --only-binary :all: 'pytest==9.1.1' 'pytest-playwright==0.7.2'"

      - name: Build host runtime for installer test
        working-directory: runtime/experience
        env:
          OVERDRIVE_EMBEDDER: stub
          OVERDRIVE_SKIP_EMBED_DOWNLOAD: "1"
        run: |
          go build -buildvcs=false -o ../../runtime/bin/overdrive-runtime-linux-amd64 .
          chmod +x ../../runtime/bin/overdrive-runtime-linux-amd64

      - name: Validate package structure
        run: python3 scripts/validate.py

      - name: Run pytest (stub embedder)
        env:
          OVERDRIVE_EMBEDDER: stub
        run: python3 -m pytest tests/ -q -m "not playwright"

      - name: Check shell script syntax
        run: bash -n scripts/*.sh hooks/run-hook.sh

      - name: Run Go tests
        working-directory: runtime/experience
        env:
          OVERDRIVE_EMBEDDER: stub
          OVERDRIVE_SKIP_EMBED_DOWNLOAD: "1"
        run: |
          go test -tags=overdrive_fake_ort -covermode=atomic -coverprofile=coverage.out ./...
          ../../scripts/go-coverage-gate.sh coverage.out

      - name: Dashboard JS coverage (lcov for Sonar)
        run: ./scripts/generate-dashboard-js-lcov.sh

      - name: Rewrite Go coverage paths for Sonar
        run: ./scripts/rewrite-go-coverage-for-sonar.sh runtime/experience/coverage.out

      - name: Resolve Sonar project version
        id: sonar_version
        run: echo "value=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: -Dsonar.projectVersion=${{ steps.sonar_version.outputs.value }}

  mutation:
    name: Mutation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: runtime/experience/go.sum

      - name: Detect security file changes
        id: filter
        run: |
          base="${{ github.base_ref }}"
          git diff --name-only "origin/${base}...HEAD" > /tmp/changed.txt
          if grep -E '^(runtime/experience/(util|share_protocol|sync_logic|decision_lifetime|span_index|handoff|peer_status|share_call|share_chat|share_chat_groups|terminal_control|terminal_env|terminal_workdir|workspace_sync)\.go|runtime/experience/\.gremlins\.yaml|scripts/mutation\.sh)$' /tmp/changed.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gremlins
        if: steps.filter.outputs.run == 'true'
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          go version -m "$(go env GOPATH)/bin/gremlins" | grep -F 'github.com/go-gremlins/gremlins'

      - name: Mutation gate
        if: steps.filter.outputs.run == 'true'
        env:
          OVERDRIVE_EMBEDDER: stub
          OVERDRIVE_SKIP_EMBED_DOWNLOAD: "1"
        run: bash scripts/mutation.sh

  browser-media:
    name: Browser call smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: runtime/experience/go.sum

      - name: Install test dependencies
        run: "pip install --only-binary :all: 'pytest==9.1.1' 'pytest-playwright==0.7.2'"

      - name: Install Playwright Chromium
        run: python3 -m playwright install chromium

      - name: Playwright mesh call smoke (fake media)
        env:
          OVERDRIVE_EMBEDDER: stub
        run: python3 -m pytest tests/test_dashboard_call_media_smoke.py tests/test_dashboard_pairing_smoke.py -q -m playwright
